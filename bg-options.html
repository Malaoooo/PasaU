<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background options · Unicycle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
  body { margin: 0; background: #0E130F; color: #ECF1E7; font-family: "Hanken Grotesk", system-ui, sans-serif; padding: 24px; }
  h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 30px; margin: 0 0 4px; letter-spacing: -0.02em; }
  p.lead { margin: 0 0 20px; color: #9AA595; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  figure { margin: 0; display: grid; gap: 8px; }
  figcaption b { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 18px; }
  figcaption span { display: block; color: #9AA595; font-size: 14px; }
  .frame { position: relative; width: 100%; aspect-ratio: 1280 / 900; overflow: hidden; border-radius: 16px; border: 1px solid rgba(255,255,255,.12); background: #000; }
  .frame iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
</style>
</head>
<body>
<h1>Background options</h1>
<p class="lead">Live previews of the real page. Nothing here changes the site.</p>
<div class="grid">
  <figure><div class="frame"><iframe data-v="A" title="Option A"></iframe></div><figcaption><b>A · Current</b><span>Dark green fading to moss, with a soft glow top-right.</span></figcaption></figure>
  <figure><div class="frame"><iframe data-v="B" title="Option B"></iframe></div><figcaption><b>B · Quiet velvet</b><span>Flatter deep green with a fine fabric-like grain. Calmer, feels like the velvet in your reference.</span></figcaption></figure>
  <figure><div class="frame"><iframe data-v="C" title="Option C"></iframe></div><figcaption><b>C · Sage daylight</b><span>Light sage page like the reference phones, with the hero as one dark green panel. Brightest and easiest to scan.</span></figcaption></figure>
  <figure><div class="frame"><iframe data-v="D" title="Option D"></iframe></div><figcaption><b>D · Wheel motif</b><span>Current gradient plus a faint giant Unicycle wheel behind the hero. Most on-brand.</span></figcaption></figure>
</div>
<script src=".bgmock.js"></script>
<script>
  document.querySelectorAll('iframe').forEach(function (f) {
    function fit() { f.style.transform = 'scale(' + (f.parentElement.clientWidth / 1280) + ')'; }
    fit(); addEventListener('resize', fit);
    f.addEventListener('load', function () { window.__bg(f.dataset.v, f.contentDocument); });
    f.src = 'index.html?preview=' + f.dataset.v;
  });
</script>
</body>
</html>
